name: Publish C.C. Codex sync release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with LFS assets
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify the v26 theme archive
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum assets/app.asar.cc-skin-v26-three-column-sidebar | awk '{print $1}')" = "8cb27db5c9fe988a0859c5bf6d4caa2bcf6f37087edddcf48960be4c559b4ebc"
          test "$(stat -c '%s' assets/app.asar.cc-skin-v26-three-column-sidebar)" = "535069488"
          grep -Eq '"spriteVersionNumber"[[:space:]]*:[[:space:]]*2' assets/pet/c-c/pet.json
          test -s assets/pet/c-c/spritesheet.webp

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp assets/app.asar.cc-skin-v26-three-column-sidebar release-assets/app.asar.cc-skin-v26-three-column-sidebar
          cp assets/pet/c-c/pet.json release-assets/pet-c-c.json
          cp assets/pet/c-c/spritesheet.webp release-assets/pet-c-c-spritesheet.webp
          gh release create "${GITHUB_REF_NAME}" release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "C.C. Codex theme and pet ${GITHUB_REF_NAME}" \
            --generate-notes
