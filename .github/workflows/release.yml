name: Publish C.C. Codex sync release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with LFS assets
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify the v25 theme archive
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum assets/app.asar.cc-skin-v25-sidebar-separation | awk '{print $1}')" = "b899357d0d9d0170110af776f5a3a5cf2dc813c38f88c4682e98c612e2b3c15b"
          test "$(stat -c '%s' assets/app.asar.cc-skin-v25-sidebar-separation)" = "535053974"
          grep -Eq '"spriteVersionNumber"[[:space:]]*:[[:space:]]*2' assets/pet/c-c/pet.json
          test -s assets/pet/c-c/spritesheet.webp

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp assets/app.asar.cc-skin-v25-sidebar-separation release-assets/app.asar.cc-skin-v25-sidebar-separation
          cp assets/pet/c-c/pet.json release-assets/pet-c-c.json
          cp assets/pet/c-c/spritesheet.webp release-assets/pet-c-c-spritesheet.webp
          gh release create "${GITHUB_REF_NAME}" release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "C.C. Codex theme and pet ${GITHUB_REF_NAME}" \
            --generate-notes
